{% extends "base.html" %}

{% block content %}
<h2>Все книги автора</h2>
<div class="books-list">
    {% for book in books %}
    <article class="book">
        <h3>{{ book.title }}</h3>
        <div class="book-meta">
            <span>Год: {{ book.year }}</span>
            <span>Жанр: {{ book.genre }}</span>
        </div>
        <p>{{ book.description }}</p>
        <a href="/book/{{ book.id }}">Читать подробнее →</a>
    </article>
    {% endfor %}
</div>
{% endblock %}
