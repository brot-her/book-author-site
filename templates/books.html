<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ author.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ author.name }}</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/books">Книги</a>
            <a href="/about">Об авторе</a>
        </nav>
    </header>
    
    <main>
        <h2>Все книги</h2>
        
        {% if books %}
        <div class="books-list">
            {% for book in books %}
            <div class="book-item">
                <h3>{{ book.title }}</h3>
                <p><strong>Год:</strong> {{ book.year }}</p>
                <p><strong>Жанр:</strong> {{ book.genre }}</p>
                <p>{{ book.description }}</p>
                <a href="/book/{{ book.id }}">Читать подробнее</a>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>Книги пока не добавлены.</p>
        {% endif %}
    </main>
</body>
</html>
