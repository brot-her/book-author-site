{% extends "base.html" %}

{% block content %}
<section class="books-page">
    <div class="container">
        <h1>Все книги</h1>
        <p class="page-description">Полная коллекция произведений автора</p>

        <div class="books-grid">
            {% for book in books %}
            <div class="book-card">
                <a href="/book/{{ book.id }}">
                    <img src="{{ book.cover_image }}" alt="{{ book.title }}" class="book-cover">
                    <div class="book-info">
                        <h3>{{ book.title }}</h3>
                        <p class="book-meta">{{ book.year }} • {{ book.genre }}</p>
                        <p class="book-description">{{ book.description[:100] }}...</p>
                        <span class="read-more">Подробнее <i class="fas fa-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
