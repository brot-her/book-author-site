<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ author.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ author.name }}</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/books">Книги</a>
            <a href="/about">Об авторе</a>
        </nav>
    </header>
    
    <main>
        <h2>Добро пожаловать!</h2>
        <p>Это сайт автора {{ author.name }}</p>
        
        {% if books %}
        <div class="books">
            <h3>Последние книги:</h3>
            {% for book in books %}
            <div class="book">
                <h4>{{ book.title }}</h4>
                <p>{{ book.year }} • {{ book.genre }}</p>
                <a href="/book/{{ book.id }}">Подробнее</a>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </main>
    
    <footer>
        <p>&copy; 2024 {{ author.name }}</p>
    </footer>
</body>
</html>
