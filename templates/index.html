{% extends "base.html" %}

{% block content %}
<section class="hero">
    <h2>Добро пожаловать на сайт автора</h2>
    <p>{{ author.bio }}</p>
</section>

<section class="featured-books">
    <h3>Последние книги</h3>
    <div class="books-grid">
        {% for book in books %}
        <div class="book-card">
            <h4>{{ book.title }}</h4>
            <p>{{ book.year }} • {{ book.genre }}</p>
            <p>{{ book.description[:100] }}...</p>
            <a href="/book/{{ book.id }}" class="btn">Подробнее</a>
        </div>
        {% endfor %}
    </div>
    <a href="/books" class="btn">Все книги →</a>
</section>
{% endblock %}
