<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ author.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">{{ author.name }}</a></h1>
            <nav>
                <a href="/">Главная</a>
                <a href="/books">Книги</a>
                <a href="/about">Об авторе</a>
                <a href="/contact">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 {{ author.name }}. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
