<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ book.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Базовые стили на случай если CSS не загрузится */
        body { margin: 0; font-family: Arial, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .btn { display: inline-block; padding: 10px 20px; background: #ff8a65; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">{{ book.title }}</a>
            <nav>
                <a href="/">Главная</a>
                <a href="/stories">Истории</a>
                <a href="/about">Об авторе</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ current_year() }} {{ book.author }}</p>
        </div>
    </footer>

    <script src="/static/js/script.js"></script>
</body>
</html>
